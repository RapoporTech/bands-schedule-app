<!DOCTYPE html>
<html>
<head>
  <base href="/bands-schedule-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manage your band schedules, events, and members in one place.">
  <!-- Fase de testes: fora dos buscadores -->
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bands Schedule">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- PWA meta tags -->
  <meta name="theme-color" content="#818CF8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bands Schedule</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Capture install prompt early before Flutter loads
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
